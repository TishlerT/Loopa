name: Loopa
options:
  bundleIdPrefix: com.loopa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  Loopa:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.yml"
          - "Package.swift"
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "build/**"
          - "Info.plist"
          - "Tests/**"
          - "memory-bank/**"
          - "maestro_output/**"
          - "TestResults.xcresult/**"
          - "**/*.xcresult"
          - "**/*.xcresult/**"
          - "*.log"
          - "*.sh"
          - "*.xml"
          - "*.md"
          - "Tish88.xcodeproj/**"
          # Exclude unused legacy code that requires external API
          - "ContentView.swift"
          - "UI/Screens/SampleBrowserView.swift"
          - "Networking/**"
          - "Models/FreesoundModels.swift"
          - "ViewModels/TishViewModel.swift"
          - "Audio/PreviewPlayer.swift"
          - "UI/Components/SoundRow.swift"
          - "UI/Components/LoopVisualization.swift"
          - "UI/Components/TransportControls.swift"
          - "UI/Components/KeyboardView.swift"
    resources:
      - path: GM.sf2
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopa.app
        INFOPLIST_KEY_CFBundleDisplayName: Loopa
        DEVELOPMENT_TEAM: K6J7TWJQK7
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Loopa
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "Loopa needs microphone access to record your vocals and singing."

  LoopaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "UI/**"
    dependencies:
      - target: Loopa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopa.app.tests
        DEVELOPMENT_TEAM: K6J7TWJQK7
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  LoopaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Loopa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopa.app.uitests
        DEVELOPMENT_TEAM: K6J7TWJQK7
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

